
name: YouTube Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run YouTube research
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python youtube_research.py

      - name: Rank research topics
        run: python topic_scorer.py

      - name: Upload research and ranked CSVs
        uses: actions/upload-artifact@v7
        with:
          name: youtube-research-results
          path: |
            output/youtube_research.csv
            output/ranked_topics.csv
          if-no-files-found: error
          retention-days: 14
